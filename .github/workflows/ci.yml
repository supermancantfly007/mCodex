name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Validate macOS launchers and deployment examples
        if: runner.os == 'macOS'
        run: |
          zsh -n scripts/manage-macos.sh scripts/start-codex-cdp-macos.sh deploy/examples/start-public-tunnel.sh.example
          plutil -lint deploy/examples/com.mcodex.public-tunnel.plist.example

      - name: Audit production dependencies
        run: npm audit --omit=dev
